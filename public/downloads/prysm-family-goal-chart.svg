<text x="52" y="666" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#15131a">OUR REWARD</text><rect x="52" y="685" width="746" height="94" rx="14" fill="#fff" stroke="#d8d0df" stroke-width="2"/>
<text x="52" y="842" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#8e57be">IDEAS TO TRY</text>
<text x="52" y="877" font-family="Arial,sans-serif" font-size="15" fill="#56515e">Pick a colorful fruit • Take a family walk • Dance to a favorite song</text>
<text x="52" y="916" font-family="Arial,sans-serif" font-size="14" fill="#56515e">Use with a grown-up. PRYSM iO is intended for children ages 3 and older.</text>
