<text x="52" y="963" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#8e57be">Created by JenniferKate™ | RemiKate Collective LLC</text>
<text x="52" y="984" font-family="Arial,sans-serif" font-size="10" fill="#56515e">Personal family-use printable for sharing. Not for resale or official Nu Skin material.</text>
<text x="52" y="1005" font-family="Arial,sans-serif" font-size="10" fill="#56515e">A score is for wellness tracking, not diagnosis. Follow device instructions.</text>
<text x="52" y="1026" font-family="Arial,sans-serif" font-size="10" fill="#56515e">Ask your child’s healthcare professional about nutrition and supplements.</text>
