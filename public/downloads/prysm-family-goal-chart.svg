<text x="52" y="143" font-family="Arial,sans-serif" font-size="41" font-weight="800" fill="#15131a">WEEKLY GOAL</text><text x="52" y="190" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#8e57be">AND REWARD CHART</text>
<text x="52" y="229" font-family="Arial,sans-serif" font-size="17" fill="#56515e">Choose one small wellness habit to practice together.</text>
<text x="52" y="289" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#15131a">OUR FAMILY GOAL</text>
<rect x="52" y="307" width="746" height="84" rx="14" fill="#fff" stroke="#d8d0df" stroke-width="2"/>
