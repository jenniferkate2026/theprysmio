<!doctype html>
<html lang="en">
  <body>
    <form name="prysm-inquiry" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="prysm-inquiry" />
      <input type="hidden" name="source" />
      <input name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <select name="preferred_contact"><option>Email</option><option>Text</option><option>Phone call</option></select>
      <select name="interest"><option>Learning about the PRYSM iO device</option><option>Requesting a free scan</option><option>Buying my own device</option><option>Another wellness question</option></select>
      <input type="text" name="primary_goal" />
      <textarea name="message"></textarea>
      <input type="checkbox" name="contact_consent" />
    </form>
  </body>
</html>
